
name: Medora Backend CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: medora
          POSTGRES_USER: medora
          POSTGRES_PASSWORD: medora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medora -d medora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/medora
      SPRING_DATASOURCE_USERNAME: medora
      SPRING_DATASOURCE_PASSWORD: medora_test_password

    steps:
      - name: Get repository code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build
